[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-rsi"
version = "0.8.0"
description = "Benchmarking and Mitigating Proxy Lock-In in Geospatial LLM Agents via Metamorphic Verification and Two-Timescale Distillation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "geopandas",
    "numpy",
    "pandas",
    "pyogrio",
    "pyproj",
    "rasterio",
    "scipy",
    "shapely",
]

[project.optional-dependencies]
dev = ["pytest"]
train = ["torch", "transformers", "peft", "accelerate", "vllm"]

[project.scripts]
meta-rsi-evolve = "meta_rsi.evolve:main"
meta-rsi-eval = "meta_rsi.eval.eval_test:main"
meta-rsi-eval-ood = "meta_rsi.eval.eval_ood:main"
meta-rsi-analysis = "meta_rsi.eval.analysis:main"

[tool.setuptools.packages.find]
include = ["meta_rsi*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
